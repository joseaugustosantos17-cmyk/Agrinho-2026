<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agrinho Sustentável</title>

<style>
body{
  font-family:Arial;
  margin:0;
  background:#e8f5e9;
  transition:0.3s;
}

header{
  background:linear-gradient(90deg,#1b5e20,#43a047);
  color:white;
  text-align:center;
  padding:20px;
}

.container{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:15px;
  padding:20px;
}

.card{
  background:white;
  padding:15px;
  border-radius:12px;
  box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

button{
  padding:10px;
  border:none;
  border-radius:8px;
  background:#43a047;
  color:white;
  cursor:pointer;
  margin-top:5px;
}

button:hover{
  background:#1b5e20;
}

.bar{
  background:#ddd;
  height:10px;
  border-radius:10px;
  overflow:hidden;
}

.fill{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#1b5e20,#66bb6a);
  transition:0.5s;
}

.dark{
  background:#0f1f0f;
  color:white;
}

.dark .card{
  background:#1e2d1e;
  color:white;
}
</style>
</head>

<body>

<header>
  <h1>🌱 Agrinho Sustentável</h1>
  <p id="status">Comece sua jornada</p>
</header>

<div class="container">

  <div class="card">
    <h3>👤 Nome</h3>
    <input id="nome" placeholder="Digite seu nome">
    <button onclick="entrar()">Entrar</button>
  </div>

  <div class="card">
    <h3>🌱 Produção</h3>
    <div class="bar"><div class="fill" id="p1"></div></div>
    <button onclick="up('p1')">Aumentar</button>
  </div>

  <div class="card">
    <h3>💧 Água</h3>
    <div class="bar"><div class="fill" id="p2"></div></div>
    <button onclick="up('p2')">Melhorar</button>
  </div>

  <div class="card">
    <h3>🌿 Sustentabilidade</h3>
    <div class="bar"><div class="fill" id="p3"></div></div>
    <button onclick="up('p3')">Evoluir</button>
  </div>

  <div class="card">
    <h3>🏆 Nível</h3>
    <p id="nivel">Iniciante</p>
  </div>

  <div class="card">
    <h3>🌗 Tema</h3>
    <button onclick="tema()">Alternar</button>
  </div>

</div>

<script>
let nome = "";

let valores = {
  p1: 10,
  p2: 10,
  p3: 10
};

function render(){
  for(let k in valores){
    document.getElementById(k).style.width = valores[k] + "%";
  }

  let media = (valores.p1 + valores.p2 + valores.p3)/3;

  let nivel =
    media < 30 ? "🌱 Iniciante" :
    media < 60 ? "🌿 Produtor" :
    media < 85 ? "🌾 Avançado" :
    "🏆 Mestre";

  document.getElementById("nivel").innerText = nivel;

  document.getElementById("status").innerText =
    nome ? `Bem-vindo ${nome} | Impacto ${Math.round(media)}%` : "Comece sua jornada 🌱";

  localStorage.setItem("save", JSON.stringify({nome,valores}));
}

function entrar(){
  nome = document.getElementById("nome").value || "";
  render();
}

function up(id){
  valores[id] = Math.min(100, valores[id] + 10);
  render();
}

function tema(){
  document.body.classList.toggle("dark");
}

/* LOAD */
window.onload = () => {
  let data = JSON.parse(localStorage.getItem("save"));
  if(data){
    nome = data.nome;
    valores = data.valores;
  }
  render();
};

render();
</script>

</body>
</html>
