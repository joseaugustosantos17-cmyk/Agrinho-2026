<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroForte 2026 | Inteligência e Sustentabilidade</title>
    <style>
        /* ===============================
           RESET E ESTILOS BASE
        =============================== */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #e0f7e9; color: #1a1a1a; line-height: 1.6; transition: 0.3s; }
        a { text-decoration: none; color: inherit; }
        img { max-width: 100%; display: block; }

        /* ===============================
           FUNDO ANIMADO
        =============================== */
        .bg-dynamic {
            position: fixed;
            inset: 0;
            z-index: -1;
            background: linear-gradient(-45deg, #0f2027, #203a43, #2c7744, #0f2027);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
        }
        @keyframes gradient {
            0% { background-position:0% 50%; }
            50% { background-position:100% 50%; }
            100% { background-position:0% 50%; }
        }

        /* ===============================
           HEADER
        =============================== */
        header { padding: 20px 0; background: rgba(255,255,255,0.2); backdrop-filter: blur(10px); }
        .container { width: 90%; max-width: 1200px; margin: auto; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 28px; font-weight: bold; color: #0f2027; }
        .logo span { color: #2c7744; }
        .header-actions button { margin-left: 10px; cursor: pointer; padding: 5px 10px; border: none; border-radius: 5px; font-size: 16px; }
        .btn-tool { background: #2c7744; color: white; }
        .btn-icon { background: #203a43; color: white; }

        /* ===============================
           HERO
        =============================== */
        .hero-minimal { display: flex; justify-content: center; align-items: center; min-height: 60vh; text-align: center; padding: 40px 20px; }
        .glass-header { background: rgba(255,255,255,0.2); backdrop-filter: blur(10px); padding: 40px; border-radius: 20px; }
        .glass-header h1 { font-size: 2.5rem; margin-bottom: 20px; color: #0f2027; }
        .glass-header p { font-size: 1.2rem; }

        /* ===============================
           DASHBOARD
        =============================== */
        .dashboard-preview { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; margin: 40px 0; }
        .stat-card { background: rgba(255,255,255,0.2); backdrop-filter: blur(10px); padding: 20px; border-radius: 15px; width: 220px; text-align: center; transition: 0.3s; }
        .stat-card:hover { transform: translateY(-10px); box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .stat-card .label { display: block; font-weight: bold; margin-bottom: 10px; }
        .stat-card .value-group { font-size: 1.8rem; color: #2c7744; margin-bottom: 10px; }
        .progress-bar { width: 100%; height: 10px; background: rgba(0,0,0,0.1); border-radius: 5px; overflow: hidden; }
        .progress-bar div { height: 100%; background: #2c7744; width: 0; transition: 1.5s; }

        /* ===============================
           SEÇÕES COM TABS
        =============================== */
        .explorer-section { padding: 40px 20px; }
        .tabs-nav { display: flex; justify-content: center; margin-bottom: 20px; gap: 10px; }
        .tab-link { padding: 10px 20px; cursor: pointer; background: rgba(255,255,255,0.2); border-radius: 10px; transition: 0.3s; }
        .tab-link.active, .tab-link:hover { background: #2c7744; color: white; }
        .tab-content { display: none; padding: 20px; background: rgba(255,255,255,0.2); border-radius: 20px; text-align: center; }
        .tab-content.active { display: block; }

        /* ===============================
           SEÇÃO TECNOLOGIAS
        =============================== */
        .tech-section { padding: 40px 20px; text-align: center; }
        .tech-section h2 { font-size: 2rem; margin-bottom: 30px; color: #0f2027; }
        .cards-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px,1fr)); gap: 20px; }
        .tech-card { padding: 25px; border-radius: 20px; transition: 0.4s; background: rgba(255,255,255,0.2); backdrop-filter: blur(10px); }
        .tech-card:hover { transform: translateY(-10px); box-shadow: 0 10px 30px rgba(0,255,120,0.3); }

        /* ===============================
           RODAPÉ
        =============================== */
        footer { padding: 30px 0; text-align: center; background: rgba(255,255,255,0.2); backdrop-filter: blur(10px); margin-top: 40px; border-top: 1px solid rgba(0,0,0,0.1); }

        /* ===============================
           MODO ESCURO
        =============================== */
        .dark-mode { background: #121212; color: #e0e0e0; }
        .dark-mode .glass-header, .dark-mode .stat-card, .dark-mode .tab-content, .dark-mode .tech-card, .dark-mode footer, .dark-mode header { background: rgba(255,255,255,0.05); color: #e0e0e0; }
        .dark-mode .tab-link.active, .dark-mode .tab-link:hover { background: #0f7744; color: #fff; }
    </style>
</head>
<body>

        <section id="explorar" class="explorer-section">
