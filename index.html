<!-- GAME AGRO -->

<section id="game" class="section-padding">

    <div class="container">

        <h2 class="section-title">
            🌾 Missão Fazenda Inteligente
        </h2>

        <div class="game-container">

            <!-- STATUS -->
            <div class="game-stats">

                <div class="stat-box">
                    <h3>💰 Agro Coins</h3>
                    <span id="coins">0</span>
                </div>

                <div class="stat-box">
                    <h3>⚡ Energia</h3>
                    <span id="energy">100</span>
                </div>

                <div class="stat-box">
                    <h3>🌱 Nível Verde</h3>
                    <span id="level">1</span>
                </div>

            </div>

            <!-- PLANTA -->
            <div class="plant-area">

                <img
                    id="plant"
                    src="https://cdn-icons-png.flaticon.com/512/628/628324.png"
                    alt="planta">

                <p id="weather-status">
                    ☀️ Clima Ensolarado
                </p>

            </div>

            <!-- AÇÕES -->
            <div class="game-actions">

                <button class="game-btn" id="water-btn">
                    💧 Regar Plantação
                </button>

                <button class="game-btn" id="solar-btn">
                    ☀️ Instalar Energia Solar
                </button>

                <button class="game-btn" id="forest-btn">
                    🌳 Preservar Floresta
                </button>

                <button class="game-btn" id="harvest-btn">
                    🚜 Fazer Colheita
                </button>

            </div>

            <!-- MISSÕES -->
            <div class="missions">

                <h3>🎯 Missões Sustentáveis</h3>

                <ul id="mission-list">

                    <li>✅ Regar a plantação</li>
                    <li>⬜ Instalar energia solar</li>
                    <li>⬜ Preservar área verde</li>
                    <li>⬜ Fazer colheita sustentável</li>

                </ul>

            </div>

        </div>

    </div>

</section>
