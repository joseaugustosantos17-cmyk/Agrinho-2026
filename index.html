<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agrinho Sustentável</title>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#e8f5e9;
  transition:0.3s;
}

header{
  background:linear-gradient(90deg,#1b5e20,#43a047);
  color:white;
  text-align:center;
  padding:20px;
}

.container{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:15px;
  padding:20px;
}

.card{
  background:white;
  padding:15px;
  border-radius:12px;
  box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

input{
  width:90%;
  padding:8px;
  margin-top:5px;
}

button{
  padding:10px;
  border:none;
  border-radius:8px;
  background:#43a047;
  color:white;
  cursor:pointer;
  margin-top:8px;
  width:100%;
}

button:hover{
  background:#1b5e20;
}

.bar{
  background:#ddd;
  height:10px;
  border-radius:10px;
  overflow:hidden;
  margin-top:5px;
}

.fill{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#1b5e20,#66bb6a);
  transition:0.5s;
}

.status{
  text-align:center;
  padding:10px;
  font-weight:bold;
}

.dark{
  background:#0f1f0f;
  color:white;
}

.dark .card{
  background:#1e2d1e;
  color:white;
}
</style>
</head>

<body>

<header>
  <h1>🌱 Agrinho Sustentável</h1>
  <p>Simulador de Fazenda Inteligente</p>
</header>

<div class="status" id="status">Digite seu nome para começar 🌱</div>

<div class="container">

  <div class="card">
    <h3>👤 Nome</h3>
    <input id="nome" placeholder="Seu nome">
    <button onclick="entrar()">Entrar</button>
  </div>

  <div class="card">
    <h3>🌱 Produção</h3>
    <div class="bar"><div class="fill" id="p1"></div></div>
    <button onclick="aumentar('p1')">Melhorar produção</button>
  </div>

  <div class="card">
    <h3>💧 Água</h3>
    <div class="bar"><div class="fill" id="p2"></div></div>
    <button onclick="aumentar('p2')">Economizar água</button>
  </div>

  <div class="card">
    <h3>🌿 Sustentabilidade</h3>
    <div class="bar"><div class="fill" id="p3"></div></div>
    <button onclick="aumentar('p3')">Evoluir sistema</button>
  </div>

  <div class="card">
    <h3>🏆 Nível</h3>
    <p id="nivel">Iniciante</p>
  </div>

  <div class="card">
    <h3>🌗 Tema</h3>
    <button onclick="tema()">Alternar modo escuro</button>
  </div>

</div>

<script>
let nome = "";
let dados = {
  p1: 10,
  p2: 10,
  p3: 10
};

/* ATUALIZAR TELA */
function atualizar(){

  for(let key in dados){
    let el = document.getElementById(key);
    el.style.width = dados[key] + "%";
  }

  let media = (dados.p1 + dados.p2 + dados.p3) / 3;

  let nivel =
    media < 30 ? "🌱 Iniciante" :
    media < 60 ? "🌿 Produtor" :
    media < 85 ? "🌾 Avançado" :
    "🏆 Mestre Sustentável";

  document.getElementById("nivel").innerText = nivel;

  document.getElementById("status").innerText =
    nome ? `Bem-vindo ${nome} | Impacto: ${Math.round(media)}%` :
           "Digite seu nome para começar 🌱";

  localStorage.setItem("agrinho", JSON.stringify({nome,dados}));
}

/* ENTRAR */
function entrar(){
  nome = document.getElementById("nome").value.trim();
  if(nome === "") return alert("Digite seu nome!");
  atualizar();
}

/* AUMENTAR BARRA */
function aumentar(id){
  dados[id] = Math.min(100, dados[id] + 10);
  atualizar();
}

/* TEMA */
function tema(){
  document.body.classList.toggle("dark");
}

/* CARREGAR DADOS */
window.onload = () => {
  let save = localStorage.getItem("agrinho");
  if(save){
    let obj = JSON.parse(save);
    nome = obj.nome;
    dados = obj.dados;
  }
  atualizar();
};
</script>

</body>
</html>
